# Streamlit Community Cloud -> your app -> Settings -> Secrets: paste this with your keys filled in.
# Root-level secrets are exposed as environment variables, which agent/config.py reads.
# (scripts/make_streamlit_secrets.py writes a filled copy to deploy/streamlit_secrets.local.toml, which is gitignored.)
GROQ_API_KEY = ""
GOOGLE_API_KEY = ""
TAVILY_API_KEY = ""
NVIDIA_API_KEY = ""

# Demo defaults: token saver on, gpt-oss-20b executor, gpt-oss-120b critic, full fallback chain
TOKEN_SAVER = "true"
GROQ_MODEL = "openai/gpt-oss-20b"
GROQ_MODEL_STRONG = "openai/gpt-oss-120b"
USE_STRONG_MODEL = "false"
LLM_FALLBACKS = "true"
# Live runs per UTC day from the UI (0 = no limit); when reached, visitors are pointed to Replay mode
DAILY_RUN_CAP = "15"
